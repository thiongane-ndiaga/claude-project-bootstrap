name: Bug
description: A behavior that does not match the spec
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: attendu
    attributes:
      label: Expected behavior
      description: Cite the relevant spec (openspec/specs/…) if there is one.
    validations:
      required: true
  - type: textarea
    id: observe
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit

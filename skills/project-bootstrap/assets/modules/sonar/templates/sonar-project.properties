# Fichier du projet : à compléter, jamais modifié par la mise à jour du plugin. Étapes : docs/sonar.md
#
# @@module:github
# Clé du projet Sonar (obligatoire dès que le secret SONAR_TOKEN existe)
# @@end
# @@module:gitlab
# Clé du projet Sonar (obligatoire dès que SONAR_ENABLED est posée)
# @@end
# sonar.projectKey=<organisation>_<depot>
# @@module:sonar-cloud
# Organisation SonarCloud
# sonar.organization=<organisation>
# @@end

sonar.sources=.
# Dossiers du plugin et documentation : hors de l'analyse. Ajouter ici les dossiers de tests, de dépendances et de fichiers générés du projet.
# @@module:github
sonar.exclusions=.claude/**,.bootstrap/**,.archgate/**,.githooks/**,.github/**,openspec/**,docs/**
# @@end
# @@module:gitlab
sonar.exclusions=.claude/**,.bootstrap/**,.archgate/**,.githooks/**,.gitlab/**,openspec/**,docs/**
# @@end

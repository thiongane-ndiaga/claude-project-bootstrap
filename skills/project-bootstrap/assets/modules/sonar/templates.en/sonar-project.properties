# Project file: fill it in, the plugin update never changes it. Steps: docs/sonar.md
#
# @@module:github
# Sonar project key (required as soon as the SONAR_TOKEN secret exists)
# @@end
# @@module:gitlab
# Sonar project key (required as soon as SONAR_ENABLED is set)
# @@end
# sonar.projectKey=<organization>_<repository>
# @@module:sonar-cloud
# SonarCloud organization
# sonar.organization=<organization>
# @@end

sonar.sources=.
# Plugin folders and documentation are left out of the analysis. Add the project's test, dependency and generated-file folders here.
# @@module:github
sonar.exclusions=.claude/**,.bootstrap/**,.archgate/**,.githooks/**,.github/**,openspec/**,docs/**
# @@end
# @@module:gitlab
sonar.exclusions=.claude/**,.bootstrap/**,.archgate/**,.githooks/**,.gitlab/**,openspec/**,docs/**
# @@end

name: Bug
description: Un comportement qui ne correspond pas à la spec
title: "[bug] "
labels: ["type:bug"]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Étapes de reproduction
    validations:
      required: true
  - type: textarea
    id: attendu
    attributes:
      label: Comportement attendu
      description: Citer la spec concernée (openspec/specs/…) si elle existe.
    validations:
      required: true
  - type: textarea
    id: observe
    attributes:
      label: Comportement observé
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version ou commit

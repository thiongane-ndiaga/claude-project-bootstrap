name: ci

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# @@module:openspec|archgate
env:
  # @@module:openspec
  OPENSPEC_VERSION: {{OPENSPEC_VERSION}}
  OPENSPEC_TELEMETRY: "0"
  # @@end
  # @@module:archgate
  ARCHGATE_VERSION: {{ARCHGATE_VERSION}}
  # @@end
# @@end

jobs:
  # systèmes de la CI : « ciOs » de .bootstrap/checks.json
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      os: ${{ steps.os.outputs.os }}
    steps:
      - uses: actions/checkout@{{CHECKOUT_REF}}
      - uses: actions/setup-node@{{SETUP_NODE_REF}}
        with:
          node-version: {{NODE_VERSION}}
      - id: os
        run: echo "os=$(node .bootstrap/run-checks.mjs --print-os)" >> "$GITHUB_OUTPUT"

  checks:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@{{CHECKOUT_REF}}
        with:
          fetch-depth: 0
      - uses: actions/setup-node@{{SETUP_NODE_REF}}
        with:
          node-version: {{NODE_VERSION}}
      # @@module:openspec
      - name: OpenSpec validate
        shell: bash
        run: |
          npm install -g "@fission-ai/openspec@${OPENSPEC_VERSION}"
          openspec validate --all --strict --no-interactive
      # @@end
      # @@module:archgate
      - name: Archgate check
        shell: bash
        run: |
          npm install -g "archgate@${ARCHGATE_VERSION}"
          archgate check --output github
      # @@end
      # Chaîne d'outils de la stack (langage, dépendances) : à installer dans .github/actions/project-setup/action.yml, pas ici
      - name: Chaîne d'outils du projet (.github/actions/project-setup)
        uses: ./.github/actions/project-setup
      - name: Commandes du projet (.bootstrap/checks.json)
        run: node .bootstrap/run-checks.mjs

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@{{CHECKOUT_REF}}
      - name: Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-pr-title.mjs

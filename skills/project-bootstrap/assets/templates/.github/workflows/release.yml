name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: googleapis/release-please-action@{{RELEASE_PLEASE_REF}}
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
